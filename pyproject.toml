[project]
name = "nugraph"
version = "0.1.0"
description = "NovelUpdates relation graph + semantic description search"
requires-python = ">=3.12,<3.13"
dependencies = [
    # data wrangling
    "pandas>=2.2",
    "pyarrow>=16",
    "tqdm>=4.66",
    # databases
    "neo4j>=5.20",          # graph: official Bolt driver
    "qdrant-client>=1.10",  # vector search
    # embeddings (CPU, local, free)
    "sentence-transformers>=3.0",
    # scraping (polite, cached, resilient)
    "requests>=2.32",
    "requests-cache>=1.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=8.3",
    # graph algorithms done in-Python (communities / kNN similarity edges)
    "networkx>=3.3",
    "scikit-learn>=1.5",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "cloudscraper>=1.2.71",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nugraph"]

[tool.ruff]
line-length = 100
